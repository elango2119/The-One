<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="The One" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#050508" />
  <title>The One</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #050508;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      overflow: hidden;
    }

    @media (min-width: 520px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 20%, #1a1b26 0%, #050508 80%);
      }
      #ios-shell {
        width: 412px;
        height: 874px;
        border-radius: 54px;
        border: 8px solid #242428;
        box-shadow: 0 35px 90px rgba(0, 0, 0, 0.85), inset 0 0 0 1.5px rgba(255, 255, 255, 0.15);
        overflow: hidden;
        position: relative;
      }
    }

    @media (max-width: 519px) {
      #ios-shell {
        width: 100vw;
        height: 100dvh;
        position: relative;
        overflow: hidden;
      }
    }

    .ios-wallpaper {
      background:
        radial-gradient(circle at 18% 15%, rgba(250, 36, 60, 0.28), transparent 45%),
        radial-gradient(circle at 82% 25%, rgba(56, 189, 248, 0.24), transparent 45%),
        radial-gradient(circle at 50% 80%, rgba(168, 85, 247, 0.22), transparent 50%),
        linear-gradient(180deg, #0b0c12 0%, #050508 100%);
    }

    .liquid-glass {
      background: rgba(28, 28, 32, 0.68);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .squircle {
      border-radius: 26px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.35);
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .squircle:active {
      transform: scale(0.91);
    }

    .reddit-icon-bg {
      background: linear-gradient(180deg, #FF6A3D 0%, #FF4500 100%);
    }
    .x-icon-bg {
      background: linear-gradient(180deg, #27272A 0%, #09090B 100%);
    }
    .apple-music-icon-bg {
      background: linear-gradient(180deg, #FA586A 0%, #FA243C 100%);
    }
    .youtube-icon-bg {
      background: linear-gradient(180deg, #FF3B30 0%, #D70015 100%);
    }
  </style>
</head>
<body>
  <div id="ios-shell" class="ios-wallpaper flex flex-col justify-center px-5 pt-14 pb-10 overflow-y-auto">

    <div class="space-y-6 my-auto">
      <!-- Clear Header Below iPhone Status Bar -->
      <div class="flex items-end justify-between px-1">
        <div>
          <p class="text-[11px] font-semibold uppercase tracking-widest text-white/50">App Launcher</p>
          <h1 class="text-3xl font-extrabold tracking-tight text-white mt-0.5">The One</h1>
        </div>
      </div>

      <!-- 2x2 App Launcher Grid -->
      <div class="grid grid-cols-2 gap-4">
        <!-- 1. Reddit (Official Logo) -->
        <a href="https://www.reddit.com" target="_blank" rel="noopener" class="liquid-glass rounded-[32px] p-5 flex flex-col items-center text-center gap-3.5 active:scale-95 transition-transform">
          <div class="w-20 h-20 squircle reddit-icon-bg flex items-center justify-center">
            <svg class="w-11 h-11 text-white" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2.25a.75.75 0 0 1 .75.75v2.05c1.82.12 3.47.66 4.73 1.48a2.1 2.1 0 1 1 2.77 3.04c.16.47.25.96.25 1.47 0 3.73-3.58 6.76-8 6.76s-8-3.03-8-6.76c0-.51.09-1 .25-1.47a2.1 2.1 0 1 1 2.77-3.04c1.26-.82 2.91-1.36 4.73-1.48V3a.75.75 0 0 1 .75-.75zm3.22 3.85c-1.03-.42-2.1-.6-3.22-.6s-2.19.18-3.22.6l.68 1.56a.75.75 0 0 1-1.15.92l-.95-.82a.6.6 0 1 0-.78.9l.86.74c-.3.48-.51 1-.61 1.54-.21 1.14.12 2.34.96 3.34 1.12 1.33 2.94 2.08 5.04 2.08s3.92-.75 5.04-2.08c.84-1 1.17-2.2.96-3.34-.1-.54-.31-1.06-.61-1.54l.86-.74a.6.6 0 1 0-.78-.9l-.95.82a.75.75 0 0 1-1.15-.92l.68-1.56zM9.25 11.2a1.35 1.35 0 1 1 0 2.7 1.35 1.35 0 0 1 0-2.7zm5.5 0a1.35 1.35 0 1 1 0 2.7 1.35 1.35 0 0 1 0-2.7zm-5.62 4.46a.75.75 0 0 1 1.05-.16c.54.4 1.17.6 1.82.6s1.28-.2 1.82-.6a.75.75 0 1 1 .89 1.21 4.48 4.48 0 0 1-2.71.89 4.48 4.48 0 0 1-2.71-.89.75.75 0 0 1-.16-1.05z"/>
            </svg>
          </div>
          <div>
            <p class="text-base font-extrabold text-white">Reddit</p>
            <p class="text-[11px] text-white/55 mt-0.5">reddit.com</p>
          </div>
        </a>

        <!-- 2. X -->
        <a href="https://x.com/i/flow/login" target="_blank" rel="noopener" class="liquid-glass rounded-[32px] p-5 flex flex-col items-center text-center gap-3.5 active:scale-95 transition-transform">
          <div class="w-20 h-20 squircle x-icon-bg border border-white/15 flex items-center justify-center">
            <span class="text-4xl font-black text-white">𝕏</span>
          </div>
          <div>
            <p class="text-base font-extrabold text-white">X</p>
            <p class="text-[11px] text-white/55 mt-0.5">x.com</p>
          </div>
        </a>

        <!-- 3. Music (YouTube Music by Default) -->
        <a href="https://music.youtube.com" target="_blank" rel="noopener" class="liquid-glass rounded-[32px] p-5 flex flex-col items-center text-center gap-3.5 active:scale-95 transition-transform">
          <div class="w-20 h-20 squircle apple-music-icon-bg flex items-center justify-center">
            <svg class="w-10 h-10 text-white" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19.5 3.2L9.2 5.3c-.6.1-1 .7-1 1.3v9.7c-.6-.3-1.3-.4-2-.3-1.8.2-3.2 1.6-3.2 3.3 0 1.8 1.5 3.1 3.4 2.9 1.7-.2 3.1-1.6 3.1-3.3V9.5l9-1.9v6.7c-.6-.3-1.3-.4-2-.3-1.8.2-3.2 1.6-3.2 3.3 0 1.8 1.5 3.1 3.4 2.9 1.7-.2 3.1-1.6 3.1-3.3V4.3c0-.7-.6-1.2-1.3-1.1z"/>
            </svg>
          </div>
          <div>
            <p class="text-base font-extrabold text-white">Music</p>
            <p class="text-[11px] text-[#FA586A] font-semibold mt-0.5">music.youtube.com</p>
          </div>
        </a>

        <!-- 4. YouTube -->
        <a href="https://m.youtube.com" target="_blank" rel="noopener" class="liquid-glass rounded-[32px] p-5 flex flex-col items-center text-center gap-3.5 active:scale-95 transition-transform">
          <div class="w-20 h-20 squircle youtube-icon-bg flex items-center justify-center">
            <i data-lucide="play" class="w-10 h-10 text-white fill-white ml-1"></i>
          </div>
          <div>
            <p class="text-base font-extrabold text-white">YouTube</p>
            <p class="text-[11px] text-white/55 mt-0.5">youtube.com</p>
          </div>
        </a>
      </div>
    </div>

  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => lucide.createIcons());
  </script>
</body>
</html>
